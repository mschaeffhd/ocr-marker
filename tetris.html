<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris</title>
    <link rel="stylesheet" href="game-style.css">
</head>
<body class="game-body">
    <div id="app">
        <div id="header">
            <h1 class="game-title">TETRIS</h1>
        </div>
        
        <div id="main">
            <div id="side">
                <div class="panel">
                    <div class="panel-title">NEXT</div>
                    <canvas id="next" width="100" height="100"></canvas>
                </div>
                
                <div class="panel">
                    <div class="panel-title">SCORE</div>
                    <div id="score" class="value">0</div>
                </div>
                
                <div class="panel">
                    <div class="panel-title">LEVEL</div>
                    <div id="level" class="value">1</div>
                </div>
                
                <div class="panel">
                    <div class="panel-title">LINES</div>
                    <div id="lines" class="value">0</div>
                </div>
            </div>
            
            <div id="game-area">
                <canvas id="canvas"></canvas>
            </div>
            
            <div id="side-right">
                <div class="panel">
                    <div class="panel-title">PLAYERS</div>
                    <div id="players"></div>
                </div>
                
                <div class="panel zoom-panel">
                    <div class="panel-title">ZOOM</div>
                    <div class="zoom-controls">
                        <button id="zoom-out" class="zoom-btn">−</button>
                        <span id="zoom-display">100%</span>
                        <button id="zoom-in" class="zoom-btn">+</button>
                    </div>
                </div>
                
                <div id="touch-controls">
                    <button id="btn-rot-l">↶</button>
                    <button id="btn-left">◀</button>
                    <button id="btn-down">▼</button>
                    <button id="btn-right">▶</button>
                    <button id="btn-rot-r">↷</button>
                    <button id="btn-drop">DROP</button>
                    <button id="btn-restart" class="btn-restart">RESTART</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
    <script>
        // Zoom button handlers
        document.getElementById('zoom-in').addEventListener('click', () => {
            zoomLevel = Math.min(2, zoomLevel + 0.1);
            localStorage.setItem('tetris-zoom', zoomLevel.toFixed(2));
            updateZoomUI();
            resizeCanvas();
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            zoomLevel = Math.max(0.5, zoomLevel - 0.1);
            localStorage.setItem('tetris-zoom', zoomLevel.toFixed(2));
            updateZoomUI();
            resizeCanvas();
        });
    </script>
</body>
</html>
