server {
    listen 80;
    server_name DEINE_DOMAIN_ODER_IP;  # z.B. ocr.schule.de oder 192.168.1.100

    root /var/www/ocr-marker;
    index index.html;

    # Statische Dateien ausliefern
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Marker-API Proxy (CORS-Bypass)
    location /api/marker/ {
        proxy_pass https://test-ki2.sbbz-ilvesheim.de/marker/;
        proxy_set_header Host test-ki2.sbbz-ilvesheim.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        client_max_body_size 100m;
    }
}
